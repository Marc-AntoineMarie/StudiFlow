
#   sudo cp deploy/nginx-studiflow.conf /etc/nginx/sites-available/studiflow
#   sudo ln -s /etc/nginx/sites-available/studiflow /etc/nginx/sites-enabled/studiflow
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d studiflow.marc-antoinemarie.com
#
# certbot réécrit ensuite ce fichier lui-même pour ajouter le bloc HTTPS (443) +
# la redirection HTTP → HTTPS : pars de cette version HTTP simple, laisse certbot
# faire la partie TLS.
#
# backend et frontend écoutent uniquement sur 127.0.0.1 (voir docker-compose.prod.yml) :
# ce bloc nginx est le seul point d'entrée public.

server {
    listen 80;
    listen [::]:80;
    server_name studiflow.marc-antoinemarie.com;

    # Documents jusqu'à 10 Mo, vidéos de portfolio jusqu'à 150 Mo (cf. backend,
    # ProjetsController) : nginx bloque tout au-delà de 1 Mo par défaut, avant
    # même que la requête n'atteigne l'API. Marge prise au-dessus de la limite
    # applicative la plus haute (vidéo) pour l'overhead multipart.
    client_max_body_size 160m;

    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Marge pour l'upload d'une vidéo volumineuse sur une connexion lente
        # (défaut nginx 60s, souvent trop court pour ~150 Mo).
        client_body_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
