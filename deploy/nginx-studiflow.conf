
#   sudo cp deploy/nginx-studiflow.conf /etc/nginx/sites-available/studiflow.marc-antoinemarie.com.conf
#   sudo ln -s /etc/nginx/sites-available/studiflow.marc-antoinemarie.com.conf /etc/nginx/sites-enabled/studiflow.marc-antoinemarie.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d studiflow.marc-antoinemarie.com
#
# Nom de fichier en ".conf" obligatoire : si nginx.conf charge les sites via
# `include sites-enabled/*.conf`, un fichier sans cette extension est
# silencieusement ignoré (bug vécu le 2026-09-02 : le vhost n'était jamais
# chargé, nginx retombait sur un autre site du serveur — cf. journal de bord).
#
# ⚠️ RECOPIER CE FICHIER SUR LE VPS EFFACE LE TRAVAIL DE CERTBOT (bug vécu le
# 2026-09-02, 2ᵉ round) : certbot réécrit ce fichier pour y ajouter le bloc
# HTTPS (443) + la redirection HTTP → HTTPS — cette version-ci, dans le dépôt,
# reste volontairement la version HTTP simple d'AVANT certbot. Donc à CHAQUE
# fois que ce fichier est recopié sur le serveur (nouvelle limite d'upload,
# nouveau timeout...), il faut relancer ensuite :
#   sudo certbot --nginx -d studiflow.marc-antoinemarie.com
# sinon le port 443 (ce qu'utilise le navigateur) n'a plus de bloc qui
# correspond, et nginx sert un tout autre site du serveur à la place.
#
# backend et frontend écoutent uniquement sur 127.0.0.1 (voir docker-compose.prod.yml) :
# ce bloc nginx est le seul point d'entrée public.

server {
    listen 80;
    listen [::]:80;
    server_name studiflow.marc-antoinemarie.com;

    # Documents jusqu'à 10 Mo, vidéos de portfolio jusqu'à 150 Mo (cf. backend,
    # ProjetsController) : nginx bloque tout au-delà de 1 Mo par défaut, avant
    # même que la requête n'atteigne l'API. Marge prise au-dessus de la limite
    # applicative la plus haute (vidéo) pour l'overhead multipart.
    client_max_body_size 160m;

    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Marge pour l'upload d'une vidéo volumineuse sur une connexion lente
        # (défaut nginx 60s, souvent trop court pour ~150 Mo).
        client_body_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
