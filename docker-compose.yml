services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cadre
      POSTGRES_PASSWORD: cadre
      POSTGRES_DB: cadre
    ports:
      - "5433:5432" # port externe 5433 pour éviter un conflit avec un postgres local
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadre -d cadre"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "4001:3001"
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4001/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  db_data:
  uploads:
